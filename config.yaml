# CAROECT-D paper-aligned pipeline configuration.
# The frame and event branches share one geometric transform. Photometric
# operations may differ after that shared grid is frozen.

paths:
  calibration_dir: "calibration"
  sim_root: "~/caroect_sim"
  v2e_repo: "~/caroect_sim/v2e"
  dvsvolt_repo: "~/caroect_sim/DVS-Voltmeter"

camera:
  # Capture timestamps use fps_original. fps_export describes only the
  # DaVinci relabel/export timeline and must never drive event timestamps or
  # detector window duration.
  fps_original: 119.88
  fps_export: 29.97
  width: 1280
  height: 720

  # Acquisition uses the camera's SDR N-RAW mode, not N-Log. DaVinci performs
  # the SDR decode and exports a linear Rec.709 16-bit TIFF working signal.
  # Python receives data that is already linear and must not apply a second
  # EOTF/inverse-gamma operation.
  input_transfer: linear
  # Linear Rec.709 uses the same D65 primaries as sRGB; only the transfer
  # function differs. The working signal here is linear, not sRGB-encoded.
  working_primaries: srgb
  luma_coeffs: [0.2126, 0.7152, 0.0722]

preprocessing:
  # Optional radiometric corrections are off until a validated
  # calibration/calibration_manifest.json explicitly supports them.
  dark_correction: false
  flat_field: false
  white_balance: false
  exposure_normalize: false
  undistort: true
  undistort_alpha: 0.0
  stabilize: false
  denoise: none
  denoise_bilateral_d: 5
  denoise_bilateral_sigma: 0.02

calibration:
  gray_card_roi: null
  board_cols: 9
  board_rows: 6
  square_size_m: 0.025
  # Capture/decode details are copied into calibration_manifest.json.
  acquisition:
    raw_mode: "SDR N-RAW 12-bit (not N-Log)"
    linearization_owner: "DaVinci Resolve"
    working_output: "linear Rec.709 RGB TIFF uint16"
    settings_id: null
  linearity_levels_dir: "linearity"
  exposure_reference_level: null

recording:
  strict_xypt: true
  flat_xypt: true
  t_unit: "us"

simulator:
  seed: 42
  envs:
    v2e: v2e
    dvsvolt: dvsvolt
  calibration_metrics:
    fields: [rate_total, on_fraction]
    weights:
      rate_total: 1.0
      on_fraction: 0.5

v2e:
  pos_thres: 0.25
  neg_thres: 0.25
  sigma_thres: 0.03
  cutoff_hz: 200
  leak_rate_hz: 0.1
  shot_noise_rate_hz: 0.001
  refractory_period: 0.001
  disable_slomo: true
  slomo_model: null

dvs_voltmeter:
  camera_type: DVS346
  k: [5.3, 20, 0.0001, 1.0e-7, 5.0e-9, 1.0e-5]

label_transfer:
  score_threshold: 0.3
  cross_class_iou: 0.85
  max_gap_frames: 5
  window_us: 8340
  window_ablation_us: [8340, 16700, 33300, 50000]
  dense_event_labels: false
  sync:
    allow_unsynced_real: false
  sam_merge:
    continuity_iou_tolerance: 0.02
    score_tolerance: 0.02
    horizon_y: 0.45
    horizon_weight: 0.35
    area_trend_weight: 0.65
  class_names:
    - car
    - truck
    - bus
    - motorcycle
    - person
    - bicycle
    - micromobility
    - other

dataset:
  # null means the native/common 1280x720 grid. Alternate sizes are
  # aspect-preserving letterbox outputs, never anisotropic scale-fill.
  img_size: null
  export_coco: true
  representation_version: "caroectd-count-time-v2"
  count_clip_percentile: 99.5

train:
  model: yolov8n.pt
  epochs: 100
  imgsz: 640
  batch: 16
  patience: 30
